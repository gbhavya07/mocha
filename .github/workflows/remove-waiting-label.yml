name: Remove "waiting for author" label on review request

on:
  pull_request_target:
    types: [review_requested]

permissions:
  issues: write

jobs:
  remove-label:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const label = 'status: waiting for author';
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: label,
              });
              console.log(`Removed label "${label}" from PR #${context.payload.pull_request.number}`);
            } catch (err) {
              if (err.status === 404) {
                console.log(`Label "${label}" was not present — nothing to remove.`);
              } else {
                throw err;
              }
            }
